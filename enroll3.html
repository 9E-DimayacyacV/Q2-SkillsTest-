    <div class="tap">
        <h1><strong>ENROLL NOW!</strong></h1>
        <p>Fill out the form below to enroll in the upcoming academic school year.</p>
    </div>

    <div class="cta">
        <div class="row">
            <!-- START OF FORMS -->
            <div class="col">
                <div class="container bg-white p-5 mt-5 mb-5 rounded">
                    <form class="form-inline" action="/action_page.php">


                        <!-- START OF STUDENT INFORMATION -->
                        <h2><strong>Student Information</strong></h2>

                        <!-- NAMES -->
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <div class="form-text">
                                    <label for="form-name" class="form-label">First name:</label> 
                                    <input type="text" class="form-control" id="name" placeholder="Juan Santos" name="username">
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-text">
                                    <label for="form-name" class="form-label">Last name:</label> 
                                    <input type="text" class="form-control" id="name" placeholder="Dela Cruz" name="username">
                                </div>
                            </div> 
                        </div>

                        <!-- DATES, GENDER, GRADE -->
                        <div class="row mt-3">
                            <div class="col-md-4">
                                <div class="form-date">
                                    <label for="birthday">Birth date:</label>
                                    <input type="date" class="form-control" id="birthday" name="birthday">
                                </div>
                            </div> 

                            <div class="col-md-4">
                                <div class="form-gender">
                                    <label for="gender">Gender:</label>
                                    <select class="form-control" name="gender" id="gender" type="gender">
                                        <option>Select...</option>
                                        <option>Male</option>
                                        <option>Female</option>
                                    </select>
                                </div>
                            </div> 

                            <div class="col-md-4">
                                <div class="form-gender">
                                    <label for="gender">Grade level:</label>
                                    <select class="form-control" name="gender" id="gender" type="gender">
                                        <option>Select...</option>
                                        <option>CASA (Kindergarten)</option>
                                        <option>Primary (1-3)</option>
                                        <option>Intermediate (4-6)</option>
                                        <option>Junior High School (7-10)</option>
                                        <option>Senior High School (11-12)</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <!-- END OF DGG -->
                        <!-- END OF STUDENT INFORMATION -->

                        <!-- START OF CONTACT DETAILS -->
                        <h2><strong>Contact Details</strong></h2>

                        <!-- EMAIL -->
                        <div class="row mt-4">
                            <div class="col-md-12">
                                <div class="form-email">
                                    <label for="gender">Email:</label>
                                    <input type="email" class="form-control" id="email" placeholder="student@example.com" name="address">
                                </div>
                            </div>
                        </div>

                        <div class="row mt-4">
                            <div class="col-md-12">
                                <div class="form-tel">
                                    <label for="phone">Enter your phone number:</label>
                                    <input class="form-control" type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}" placeholder="0912-345-678">
                                </div>
                            </div>
                        </div>
                        <!-- END OF CONTACT DETAILS -->
                        
                        <!-- START OF OTHER INFORMATION -->
                        <h2><strong>Other Information</strong></h2>

                        <label for="features">Mode of Learning:</label> 
                            <div class="form-check">
                                <label class="form-check-label">
                                    <input class="form-check-input" type="radio" name="feature" value="f2f"> Face-to-Face</label>
                            </div>

                            <div class="form-check">
                                <label class="form-check-label">
                                    <input class="form-check-input" type="radio" name="feature" value="online" checked>Online Learning</label>
                            </div>

                        <br>

                        <div class="form-check">
                            <label class="form-check-label">
                            <input class="form-check-input" type="checkbox" name="feature" value="confirm">I confirm that the information provided is true and complete.</label>
                        </div>

                        <div class="row mt-2">
                            <button class="btn btn-info text-white m-1" type="button">Submit Application</button>
                        </div>
                    </form>
                </div>
            </div>
            <!-- END OF FORMS -->
    </div>
